<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CofreSeguro</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>🔐 CofreSeguro</h1>
    <p>Gerenciador de senhas — Projeto Integrador 4</p>
  </header>
  <main>

    <div class="card" id="tela-bloqueio">
      <h2>Acesse seu cofre</h2>
      <label>Usuário</label>
      <input id="in-usuario" autocomplete="off">
      <label>Senha-mestra</label>
      <input id="in-senha-mestra" type="password">
      <div class="linha">
        <button id="btn-desbloquear">Desbloquear</button>
        <button class="sec" id="btn-criar">Criar cofre</button>
      </div>
      <div class="msg" id="msg-bloqueio"></div>
    </div>

    <div class="card oculto" id="tela-cofre">
      <div id="topo-cofre">
        <h2 class="sem-margem">Suas senhas</h2>
        <button class="sec" id="btn-bloquear">Bloquear</button>
      </div>

      <div class="secao-add">
        <label>Título (ex: Nubank)</label>
        <input id="in-titulo" autocomplete="off">
        <label>Usuário do serviço (opcional)</label>
        <input id="in-usuario-servico" autocomplete="off">
        <label>Senha</label>
        <div class="linha-senha">
          <input id="in-senha" autocomplete="off">
          <button class="sec mini" id="btn-gerar">Gerar</button>
        </div>
        <div class="linha">
          <button id="btn-salvar">Adicionar senha</button>
          <button id="btn-cancelar" class="sec oculto">Cancelar</button>
        </div>
        <div class="msg" id="msg-cofre"></div>
      </div>

      <label class="mt18">Buscar</label>
      <input id="in-busca" placeholder="Buscar por titulo, usuario ou site" autocomplete="off">
      <div id="lista"></div>
    </div>

  </main>

  <script src="/static/app.js"></script>
</body>
</html>
